# .github/workflows/ps2.yml of ps2max32/mxlink (template: ci/mxlink.yml of ps2max32/docker).
# Builds with the commits its ps2max.deps names (LLVM, maxsdk, ...), through
# the reusable build of ps2max32/docker. Every push and PR: ps2link.irx
# (the kernel's host link) and mxlink.elf (the app, mc0:/MXOS/MXLINK.ELF) as an artifact.
name: ps2

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ps2:
    uses: ps2max32/docker/.github/workflows/build.yml@main
    with:
      artifacts: |
        out/ps2link.irx
        out/mxlink.elf
      release: false
