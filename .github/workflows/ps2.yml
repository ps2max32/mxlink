# .github/workflows/ps2.yml of ps2max32/mxlink, mx OS's host link.
# Every push and PR: build its IOP module, ps2link.irx, with
# ghcr.io/ps2max32/ps2max (clang and ld.lld for the IOP), as an artifact.
name: ps2

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-26.04
    container: ghcr.io/ps2max32/ps2max:latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: make -j$(nproc) OUT=$PWD/out
      - uses: actions/upload-artifact@v7
        with:
          name: mxlink-${{ github.sha }}
          path: out/ps2link.irx
          if-no-files-found: error
